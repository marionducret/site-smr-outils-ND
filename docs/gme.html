<style>
:root { --teal: #17807e; --teal-dark: #0f5f5d; --teal-wash: #e8f4f3; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(160deg, #f7f9f9 0%, #e8f4f3 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: #17262b;
}
.box {
  background: #fff; border: 1px solid #dde6e6; border-radius: 18px;
  box-shadow: 0 10px 40px rgba(23,128,126,.12);
  padding: 40px 36px; width: min(400px, 92vw); text-align: center;
}
.box img { height: 52px; margin-bottom: 14px; }
h1 { font-size: 19px; margin: 0 0 4px; color: var(--teal-dark); }
p.sub { color: #5f7075; font-size: 13.5px; margin: 0 0 22px; }
input[type=password] {
  width: 100%; padding: 12px 14px; font-size: 15px; border: 1.5px solid #c9d7d6;
  border-radius: 10px; outline: none;
}
input[type=password]:focus { border-color: var(--teal); }
label.remember {
  display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: #5f7075;
  margin: 14px 0 18px; justify-content: center; cursor: pointer;
}
button {
  width: 100%; background: var(--teal); color: #fff; border: none; border-radius: 10px;
  padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer;
}
button:hover { background: var(--teal-dark); }
button:disabled { background: #9fbcbb; cursor: wait; }
.err { color: #c62828; font-size: 13.5px; margin-top: 12px; display: none; font-weight: 600; }
</style>

  <p class="sub">Accès réservé — saisissez le mot de passe qui vous a été transmis.</p>

    <button type="submit" id="go">Accéder aux outils</button>
    <div class="err" id="err">Mot de passe incorrect.</div>
  </form>
</div>

const LS_KEY = 'Outils_SMR_Ducret_portal_key_v1';

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function tryDecrypt(rawKey) {
  const key = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64(PAYLOAD.nonce) }, key, b64(PAYLOAD.ciphertext));
  return new TextDecoder().decode(plain);
}

// Bouton « Se déconnecter » injecté en bas à droite de chaque page déchiffrée :
// efface les clés mémorisées (session + persistante) et recharge la page.
const LOGOUT_SNIPPET = '<a href="#" title="Oublier le mot de passe sur cet ordinateur" ' +
  'onclick="try{sessionStorage.removeItem(\'' + LS_KEY + '\');localStorage.removeItem(\'' + LS_KEY + '\');}catch(e){};location.reload();return false;" ' +
  'style="position:fixed;bottom:16px;right:16px;z-index:9999;background:#ffffff;' +
  'color:#5f7075;border:1px solid #dde6e6;text-decoration:none;font-weight:600;' +
  'font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,sans-serif;' +
  'font-size:12.5px;padding:7px 13px;border-radius:999px;' +
  'box-shadow:0 2px 8px rgba(0,0,0,.12);">🔒 Se déconnecter</a>';

function show(html) {
  if (html.includes('</body>')) {
    html = html.replace('</body>', LOGOUT_SNIPPET + '</body>');
  } else {
    html += LOGOUT_SNIPPET;
  }
  document.open();
  document.write(html);
  document.close();
}

async function deriveKey(password) {
  const material = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', hash: 'SHA-256', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iterations },
    material, 256);
  return new Uint8Array(bits);
}

// Auto-déverrouillage : clé de session (une saisie par visite),
// puis clé persistante (« se souvenir de moi »).
// Important : attendre la fin du chargement de la page avant de la réécrire,
// sinon document.open() est ignoré par le navigateur.
function whenReady(fn) {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', fn);
  } else {
    fn();
  }
}
whenReady(() => {
  (async () => {
    try {
      const sess = sessionStorage.getItem(LS_KEY);
      if (sess) { show(await tryDecrypt(b64(sess))); return; }
    } catch (e) { sessionStorage.removeItem(LS_KEY); }
    try {
      const stored = localStorage.getItem(LS_KEY);
      if (stored) show(await tryDecrypt(b64(stored)));
    } catch (e) { localStorage.removeItem(LS_KEY); }
  })();
});

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('go');
  const err = document.getElementById('err');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Vérification…';
  try {
    const rawKey = await deriveKey(document.getElementById('pw').value);
    const html = await tryDecrypt(rawKey);
    const keyB64 = btoa(String.fromCharCode(...rawKey));
    // Toujours mémorisé pour la session en cours : une seule saisie par visite,
    // quelle que soit la page par laquelle on navigue.
    sessionStorage.setItem(LS_KEY, keyB64);
    if (document.getElementById('remember').checked) {
      localStorage.setItem(LS_KEY, keyB64);
    }
    show(html);
  } catch (ex) {
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Accéder aux outils';
  }
});
</script>
