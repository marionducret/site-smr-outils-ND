    font: inherit; font-weight: 600; font-size: 13.5px; line-height: 1.55;
    color: var(--teal-dark, #0f5f5d); background: none; border: 0; cursor: pointer;

  }
  .navbtn:hover, .navgroup.open > .navbtn { background: var(--teal-wash, #e8f4f3); }
  .navgroup:has(.navmenu a.active) > .navbtn { background: var(--teal, #17807e); color: #fff; }
  .navbtn .chev { font-size: 10px; opacity: .65; transition: transform .15s; }
  .navgroup.open > .navbtn .chev { transform: rotate(180deg); }
  .navmenu {
    display: none; position: absolute; right: 0; top: calc(100% + 8px); z-index: 80;
    min-width: 250px; padding: 6px;
    background: #fff; border: 1px solid var(--border, #dde6e6); border-radius: 12px;

  </style>
  <script>
  (function () {
    function closeAll(except) {
      document.querySelectorAll('.navgroup.open').forEach(function (g) {
        if (g === except) return;
        g.classList.remove('open');
        var b = g.querySelector('.navbtn');
        if (b) b.setAttribute('aria-expanded', 'false');
      });
    }
    document.addEventListener('click', function (e) {
      var btn = e.target.closest && e.target.closest('.navbtn');
      if (!btn) { closeAll(null); return; }
      var group = btn.closest('.navgroup');
      var willOpen = !group.classList.contains('open');
      closeAll(group);
      group.classList.toggle('open', willOpen);
      btn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
      e.preventDefault();
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAll(null); });
  })();
  </script>
