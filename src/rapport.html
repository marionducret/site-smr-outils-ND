<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="96x96" href="assets/favicon-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="apple-touch-icon-precomposed" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="assets/favicon-outils-smr-ducret.svg">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="manifest" href="assets/site.webmanifest">
<meta name="theme-color" content="#35706A">
<title>Rapport mensuel — Outils SMR Ducret</title>
<style>
:root {
  --teal: #17807e;
  --teal-dark: #0f5f5d;
  --teal-wash: #e8f4f3;
  --page: #f7f9f9;
  --surface: #ffffff;
  --text: #17262b;
  --muted: #5f7075;
  --border: #dde6e6;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--page); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.55; display: flex; flex-direction: column;
}
header {
  background: var(--surface); border-bottom: 3px solid var(--teal);
  padding: 14px 24px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
}
header img { height: 44px; }
header nav { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; }
header nav a {
  color: var(--teal-dark); text-decoration: none; font-weight: 600; font-size: 13.5px;
  padding: 7px 12px; border-radius: 8px;
}
header nav a:hover { background: var(--teal-wash); }
header nav a.active { background: var(--teal); color: #fff; }
.bar {
  display: flex; align-items: center; gap: 14px; padding: 12px 24px; flex-wrap: wrap;
}
.bar p { margin: 0; color: var(--muted); font-size: 14px; }
.bar a.open {
  background: var(--teal); color: #fff; text-decoration: none; font-weight: 700;
  font-size: 14px; padding: 9px 16px; border-radius: 10px; white-space: nowrap;
}
.bar a.open:hover { background: var(--teal-dark); }
#frame-wrap { flex: 1; min-height: 0; padding: 0 16px 16px; }
iframe {
  width: 100%; height: 100%; min-height: 70vh; border: 1px solid var(--border);
  border-radius: 12px; background: #fff;
}
.notice {
  max-width: 760px; margin: 40px auto; background: var(--surface);
  border: 1px solid var(--border); border-radius: 14px; padding: 26px; text-align: center;
}
</style>
</head>
<body>
<header>
  <img src="assets/logo-outils-smr-ducret.svg" alt="Outils SMR Ducret">
  <nav>
    <!-- ⚠️ Navigation injectée automatiquement au build depuis nav.html (racine du projet).
         Pour modifier la barre de navigation : éditer nav.html, PAS ce fichier. -->
  </nav>
</header>

<div class="bar">
  <p>Générateur de rapport d'évolution mensuelle SMR. Si l'application ne s'affiche pas ci-dessous, ouvrez-la dans un nouvel onglet :</p>
  <a class="open" id="openBtn" href="#" target="_blank" rel="noopener">Ouvrir en plein écran ↗</a>
</div>

<div id="frame-wrap">
  <iframe id="appFrame" title="Rapport mensuel Outils SMR Ducret" allow="clipboard-write"></iframe>
</div>

<script>
// ⚠️ URL de l'application Streamlit du rapport mensuel — à remplacer par la vraie URL :
const STREAMLIT_URL = "https://marion-ducret-rapport-mensuel-solimed.streamlit.app";

document.getElementById('openBtn').href = STREAMLIT_URL;
if (STREAMLIT_URL.includes('VOTRE-APP')) {
  document.getElementById('frame-wrap').innerHTML =
    '<div class="notice"><h2 style="color:var(--teal-dark); margin-top:0;">Application non configurée</h2>' +
    '<p>L\'URL de l\'application Streamlit n\'a pas encore été renseignée dans <code>rapport.html</code>.</p></div>';
} else {
  document.getElementById('appFrame').src = STREAMLIT_URL + (STREAMLIT_URL.includes('?') ? '&' : '?') + 'embed=true';
}
</script>
</body>
</html>
