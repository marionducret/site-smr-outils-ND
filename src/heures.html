<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="assets/favicon-outils-smr-ducret.svg">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="manifest" href="assets/site.webmanifest">
<meta name="theme-color" content="#35706A">
<title>Heures Marion — Outils SMR</title>
<link rel="stylesheet" href="assets/portail.css">
<style>
  .mois-titre td { background: var(--teal-wash); font-weight: 700; color: var(--teal-dark); font-size: 13px; }
  .mois-titre .libelle { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .montant { display: block; font-weight: 700; color: var(--teal-dark); font-size: 13px; margin-top: 1px; }
  tfoot .montant { font-size: 14px; }
  .badge.paye { background: #e6f0fb; color: #17558a; }
  .badge.attente { background: #f3f0e6; color: #8a6100; }
  .mini.paiement { border-color: #cfe3e2; color: var(--teal-dark); }
  .mini.lien { border: 0; background: none; text-decoration: underline; padding: 4px 2px; }
  .mois-titre.solde td { background: #f4f7f7; color: var(--muted); }
  .mois-titre.solde .libelle { color: var(--text); }
  .ligne-actions { white-space: nowrap; text-align: right; }
  .mini { font: inherit; font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 8px;
          border: 1px solid var(--border); background: #fff; color: var(--muted); cursor: pointer; }
  .mini:hover { background: var(--teal-wash); color: var(--teal-dark); border-color: var(--teal); }
  .badge.fact { cursor: default; }
  .badge.fact.clic { cursor: pointer; }
  .form-grid { display: grid; grid-template-columns: 130px 180px 1fr 100px auto; gap: 10px; align-items: end; }
  .form-grid label { margin: 0 0 4px; }
  @media (max-width: 780px) { .form-grid { grid-template-columns: 1fr; } }
  .etat-msg { font-size: 13.5px; color: var(--muted); }
  .role-tag { font-size: 11.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
              background: var(--teal-wash); color: var(--teal-dark); }
</style>
</head>
<body>
<header>
  <img src="assets/logo-outils-smr-ducret.svg" alt="outils_SMR">
  <nav>
    <!-- Navigation injectee automatiquement au build depuis nav.html -->
  </nav>
</header>
<main class="wide">
  <p class="breadcrumb"><a href="index.html">Accueil</a> &rsaquo; Admin &rsaquo; Heures Marion</p>
  <div class="page-head">
    <div class="icon">⏱</div>
    <div>
      <h1>Heures Marion</h1>
      <p>Temps passé sur le développement et la maintenance des outils.</p>
    </div>
    <div class="actions"><span class="role-tag" id="role-tag">…</span></div>
  </div>

  <!-- Saisie : visible uniquement en profil administratrice -->
  <div class="card" id="bloc-saisie" hidden>
    <h2>Ajouter une intervention</h2>
    <div class="form-grid">
      <div><label for="f-date">Date</label><input id="f-date" type="date"></div>
      <div><label for="f-perimetre">Périmètre</label><input id="f-perimetre" type="text" placeholder="Portail, Analyse GME…"></div>
      <div><label for="f-objet">Objet</label><input id="f-objet" type="text" placeholder="Ce qui a été fait"></div>
      <div><label for="f-duree">Durée (h)</label><input id="f-duree" type="number" step="0.25" min="0" placeholder="1.5"></div>
      <div><button class="btn" id="btn-ajout">Ajouter</button></div>
    </div>
    <p class="field-hint" id="msg-saisie" role="status"></p>
  </div>

  <div class="card">
    <h2>Relevé</h2>
    <p class="etat-msg" id="chargement">Chargement…</p>
    <table id="tbl" hidden>
      <thead>
        <tr>
          <th style="width:105px">Date</th>
          <th style="width:150px">Périmètre</th>
          <th>Objet</th>
          <th class="num" style="width:90px">Durée</th>
          <th class="ligne-actions" style="width:90px" id="th-actions" hidden></th>
        </tr>
      </thead>
      <tbody id="corps"></tbody>
    </table>
    <p class="field-hint" id="reste"></p>
  </div>
</main>
<script>
(function () {
  var P = window.PORTAL || { role: 'user', api: '', token: '' };
  var ADMIN = P.role === 'admin';

  // Taux horaire appliqué aux montants affichés. Pour le modifier :
  // changer cette valeur, rebuilder (python3 build.py) et pousser.
  var TAUX_HORAIRE = 20;
  var etat = { heures: [], facturation: {}, paiement: {} };

  if (ADMIN) {
    document.getElementById('bloc-saisie').hidden = false;
    document.getElementById('th-actions').hidden = false;
  }

  function api(chemin, methode, corps) {
    if (!P.api) return Promise.reject(new Error('API non configurée'));
    return fetch(P.api.replace(/\/+$/, '') + chemin, {
      method: methode || 'GET',
      headers: { 'Content-Type': 'application/json', 'X-Portal-Token': P.token || '' },
      body: corps ? JSON.stringify(corps) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) throw new Error(d.erreur || ('Erreur ' + r.status));
        return d;
      });
    });
  }

  function fmtDuree(h) {
    var e = Math.floor(h), m = Math.round((h - e) * 60);
    if (m === 60) { e += 1; m = 0; }
    return e + ' h' + (m ? ' ' + String(m).padStart(2, '0') : '');
  }
  function fmtEuros(heures) {
    return (heures * TAUX_HORAIRE).toLocaleString('fr-FR',
      { style: 'currency', currency: 'EUR', minimumFractionDigits: 2 });
  }
  function fmtDate(iso) {
    if (!iso) return '—';
    var p = String(iso).slice(0, 10).split('-');
    return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso;
  }
  function moisDe(iso) {
    var p = String(iso || '').slice(0, 7).split('-');
    if (p.length !== 2) return 'Sans date';
    var noms = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
    return noms[parseInt(p[1], 10) - 1] + ' ' + p[0];
  }
  function echap(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Mois payés et terminés : repliés sur une seule ligne récapitulative.
  // « deplie » garde les mois que l'on a rouverts à la main (le temps de la visite).
  var deplie = {};

  function moisCourant() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  function grouper(lignes) {
    var groupes = [], index = {};
    lignes.forEach(function (l) {
      var cle = String(l.date || '').slice(0, 7) || 'sans-date';
      if (!(cle in index)) {
        index[cle] = groupes.length;
        groupes.push({ cle: cle, libelle: moisDe(l.date), lignes: [], total: 0 });
      }
      var g = groupes[index[cle]];
      g.lignes.push(l);
      g.total += Number(l.duree) || 0;
    });
    return groupes;
  }

  function rendre() {
    var corps = document.getElementById('corps');
    corps.innerHTML = '';

    var lignes = etat.heures.slice().sort(function (a, b) {
      return String(b.date || '').localeCompare(String(a.date || ''));
    });
    if (!lignes.length) {
      corps.innerHTML = '<tr><td colspan="5" class="etat-msg">Aucune intervention enregistrée pour le moment.</td></tr>';
      document.getElementById('reste').textContent = '';
      document.getElementById('chargement').hidden = true;
      document.getElementById('tbl').hidden = false;
      return;
    }

    var courant = moisCourant();
    grouper(lignes).forEach(function (g) {
      var facture = etat.facturation[g.cle] === 'facture';
      var paie = etat.paiement[g.cle];
      var paye = !!(paie && paie.etat === 'paye');
      var termine = g.cle !== courant && g.cle !== 'sans-date';
      var reductible = paye && termine;
      var replie = reductible && !deplie[g.cle];

      var tr = document.createElement('tr');
      tr.className = 'mois-titre' + (replie ? ' solde' : '');
      tr.innerHTML =
        '<td colspan="3"><span class="libelle">' + echap(g.libelle) +
          (replie
            ? '<span class="badge paye">💶 payé' + (paie.le ? ' le ' + fmtDate(paie.le) : '') +
              (paie.par ? ' · ' + echap(paie.par) : '') + '</span>'
            : '<span class="badge fact ' + (facture ? 'done' : 'wip') + '">' +
                (facture ? 'facturé' : 'à facturer') + '</span>' +
              (ADMIN && g.cle !== 'sans-date'
                ? '<button class="mini" data-fact="' + g.cle + '" data-vers="' + (facture ? 'a_facturer' : 'facture') + '">' +
                  (facture ? 'Marquer à facturer' : 'Marquer facturé') + '</button>'
                : '') +
              (paye
                ? '<span class="badge paye">💶 payé' + (paie.le ? ' le ' + fmtDate(paie.le) : '') +
                  (paie.par ? ' · ' + echap(paie.par) : '') + '</span>'
                : '<span class="badge attente">💶 en attente de paiement</span>') +
              (!ADMIN && g.cle !== 'sans-date'
                ? '<button class="mini paiement" data-paie="' + g.cle + '" data-vers="' + (paye ? 'non_paye' : 'paye') + '">' +
                  (paye ? 'Annuler le paiement' : 'Indiquer comme payé') + '</button>'
                : '')) +
          (reductible
            ? '<button class="mini lien" data-plier="' + g.cle + '">' +
              (replie ? 'Voir le détail' : 'Masquer le détail') + '</button>'
            : '') +
        '</span></td>' +
        '<td class="num">' + fmtDuree(g.total) +
          '<span class="montant">' + fmtEuros(g.total) + '</span></td>' +
        (ADMIN ? '<td></td>' : '');
      corps.appendChild(tr);

      if (replie) return;

      g.lignes.forEach(function (l) {
        var ligne = document.createElement('tr');
        ligne.innerHTML =
          '<td>' + fmtDate(l.date) + '</td>' +
          '<td>' + echap(l.perimetre) + '</td>' +
          '<td>' + echap(l.objet) + '</td>' +
          '<td class="num">' + fmtDuree(Number(l.duree) || 0) + '</td>' +
          (ADMIN ? '<td class="ligne-actions"><button class="mini" data-suppr="' + l.id + '">Supprimer</button></td>' : '');
        corps.appendChild(ligne);
      });
    });

    document.getElementById('reste').textContent =
      'Montants calculés à ' + fmtEuros(1) + " de l'heure.";
    document.getElementById('chargement').hidden = true;
    document.getElementById('tbl').hidden = false;
  }

  function charger() {
    if (!P.api) {
      document.getElementById('chargement').textContent =
        "Le relevé partagé n'est pas encore branché (API non configurée).";
      return;
    }
    api('/state').then(function (d) {
      etat.heures = d.heures || [];
      etat.facturation = d.facturation || {};
      etat.paiement = d.paiement || {};
      rendre();
    }).catch(function (e) {
      document.getElementById('chargement').textContent = 'Impossible de charger le relevé : ' + e.message;
    });
  }

  // --- actions administratrice ---
  // Paiement : c'est Nathalie qui paie, le bouton n'apparaît donc que sur son profil.
  document.getElementById('corps').addEventListener('click', function (e) {
    var pli = e.target.closest('[data-plier]');
    if (pli) {
      var cle = pli.getAttribute('data-plier');
      deplie[cle] = !deplie[cle];
      rendre();
      return;
    }
    var b = e.target.closest('[data-paie]');
    if (!b) return;
    b.disabled = true;
    api('/paiement/' + b.getAttribute('data-paie'), 'PATCH', { etat: b.getAttribute('data-vers') })
      .then(function (d) { etat.paiement = d.paiement || etat.paiement; rendre(); })
      .catch(function (err) { b.disabled = false; alert("Échec : " + err.message); });
  });

  if (ADMIN) {
    document.getElementById('f-date').value = new Date().toISOString().slice(0, 10);
    document.getElementById('btn-ajout').addEventListener('click', function () {
      var msg = document.getElementById('msg-saisie');
      var l = {
        date: document.getElementById('f-date').value,
        perimetre: document.getElementById('f-perimetre').value.trim(),
        objet: document.getElementById('f-objet').value.trim(),
        duree: parseFloat(document.getElementById('f-duree').value)
      };
      if (!l.objet || !(l.duree > 0)) { msg.textContent = 'Objet et durée sont nécessaires.'; return; }
      msg.textContent = 'Enregistrement…';
      api('/heures', 'POST', l).then(function (d) {
        etat.heures = d.heures || etat.heures;
        rendre();
        msg.textContent = 'Ligne ajoutée.';
        document.getElementById('f-objet').value = '';
        document.getElementById('f-duree').value = '';
      }).catch(function (e) { msg.textContent = 'Échec : ' + e.message; });
    });

    document.getElementById('corps').addEventListener('click', function (e) {
      var f = e.target.closest('[data-fact]');
      if (f) {
        api('/facturation/' + f.getAttribute('data-fact'), 'PATCH', { etat: f.getAttribute('data-vers') })
          .then(function (d) { etat.facturation = d.facturation || etat.facturation; rendre(); });
        return;
      }
      var s = e.target.closest('[data-suppr]');
      if (s && confirm('Supprimer cette ligne ?')) {
        api('/heures/' + s.getAttribute('data-suppr'), 'DELETE')
          .then(function (d) { etat.heures = d.heures || etat.heures; rendre(); });
      }
    });
  }

  charger();
})();
</script>
</body>
</html>
